version: "3.8"

# ArchVision AI — production-ish stack. PostgreSQL only; rate limiting is
# in-memory per app instance (single instance per deploy).
# Set POSTGRES_USER / POSTGRES_PASSWORD in your shell before `docker compose up`
# — the defaults are deliberately unsafe placeholders that must be replaced.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-CHANGE_ME_user}:${POSTGRES_PASSWORD:-CHANGE_ME_password}@db:5432/archvision
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-CHANGE_ME_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME_password}
      - POSTGRES_DB=archvision
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-CHANGE_ME_user} -d archvision"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
